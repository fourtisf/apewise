<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05090C"/><stop offset="60%" stop-color="#070F0C"/><stop offset="100%" stop-color="#04120C"/>
    </linearGradient>
    <linearGradient id="em" x1="0" y1="-1" x2="0" y2="1">
      <stop offset="0%" stop-color="#8CF7CF"/><stop offset="55%" stop-color="#22D69A"/><stop offset="100%" stop-color="#0BAE79"/>
    </linearGradient>
    <linearGradient id="emW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BF3BE"/><stop offset="100%" stop-color="#0BAE79"/>
