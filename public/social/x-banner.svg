    <path d="M0,-34 C-18,-52 -46,-78 -104,-96 C-70,-62 -36,-30 -12,8 C-7,34 -3,58 0,80 C3,58 7,34 12,8 C36,-30 70,-62 104,-96 C46,-78 18,-52 0,-34 Z" fill="url(#em)"/>
  </g>

  <text x="86" y="230" font-size="128" font-weight="bold" letter-spacing="1" fill="#EAF3EE"><tspan fill="url(#emW)">APE</tspan>WISE</text>
  <text x="92" y="290" font-size="35" font-weight="bold" fill="#9FB6AC" letter-spacing="0.5">Smart-money &amp; whale alpha on Solana</text>

