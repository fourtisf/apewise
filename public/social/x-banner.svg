    <circle cx="8" cy="-8" r="6"/><text x="24" y="0" fill="#BFE9D8">Whale tracker</text>
    <circle cx="228" cy="-8" r="6"/><text x="244" y="0" fill="#BFE9D8">High-win-rate wallets</text>
    <circle cx="560" cy="-8" r="6"/><text x="576" y="0" fill="#BFE9D8">24/7 autonomous</text>
  </g>
  <text x="600" y="430" font-size="27" font-weight="bold" fill="#12C98C" letter-spacing="1">@apewiseai</text>
  <text x="600" y="466" font-size="21" fill="#6E8880" letter-spacing="1.5">SOLANA · BSC · BASE · ETHEREUM · TRON</text>
